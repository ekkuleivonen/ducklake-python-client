[project]
name = "ducklake-client"
version = "0.1.0"
description = "Lightweight wrapper over DuckDB with convenience helpers for DuckLake."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "duckdb",
]


authors = [
  { name = "Ekku Leivonen", email = "ekku.leivonen@gmail.com" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducklake_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/ducklake_client/methods/create_schema/template.sql" = "ducklake_client/methods/create_schema/template.sql"
"src/ducklake_client/methods/create_table/template.sql" = "ducklake_client/methods/create_table/template.sql"
"src/ducklake_client/methods/list_tables/template.sql" = "ducklake_client/methods/list_tables/template.sql"
"src/ducklake_client/methods/list_views/template.sql" = "ducklake_client/methods/list_views/template.sql"
"src/ducklake_client/methods/table_info/columns.sql" = "ducklake_client/methods/table_info/columns.sql"
"src/ducklake_client/methods/table_info/duckdb_columns.sql" = "ducklake_client/methods/table_info/duckdb_columns.sql"
"src/ducklake_client/methods/table_info/duckdb_table.sql" = "ducklake_client/methods/table_info/duckdb_table.sql"
"src/ducklake_client/methods/table_info/ducklake_metadata.sql" = "ducklake_client/methods/table_info/ducklake_metadata.sql"
"src/ducklake_client/methods/table_info/partition_specs.sql" = "ducklake_client/methods/table_info/partition_specs.sql"
"src/ducklake_client/methods/table_info/row_count.sql" = "ducklake_client/methods/table_info/row_count.sql"
"src/ducklake_client/methods/table_info/snapshots.sql" = "ducklake_client/methods/table_info/snapshots.sql"
"src/ducklake_client/methods/table_info/sort_specs.sql" = "ducklake_client/methods/table_info/sort_specs.sql"
"src/ducklake_client/methods/table_info/summary.sql" = "ducklake_client/methods/table_info/summary.sql"
"src/ducklake_client/methods/table_info/table.sql" = "ducklake_client/methods/table_info/table.sql"
